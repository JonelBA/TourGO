

<!DOCTYPE html>

    <style>        /* Add this to your existing style block */
textarea.form-control {
    resize: none;
    min-height: 100px;
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    transition: border-color 0.3s;
}

textarea.form-control:focus {
    border-color: var(--primary-color);
    outline: none;
}
    </style>
    <link rel="icon" type="image/svg+xml" href="../public/assets/images/tourgo-favicon.svg">
    <link rel="icon" type="image/png" sizes="64x64" href="../public/assets/images/tourgo-favicon.png">
</head>
<body>
    <div class="admin-dashboard">
        <header class="admin-header">
            <div class="admin-header-content">
                <div class="logo-area">
                    <div class="logo">
                        <i class="fas fa-car-side"></i>
                        <span><span style="color: var(--text-dark);">Tour</span><span style="color: var(--text-light);">Go</span></span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" aria-label="Toggle Dark Mode">
                        <i class="fas "></i>
                    </button>
                    <div class="profile-toggle admin-profile-static" aria-label="Admin account" tabindex="-1">
                                                <img src="https://avatar.iran.liara.run/public/boy?username=Admin" alt="Admin">
                                                <span>Admin</span>
                    </div>
                    <div class="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </div>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <aside class="admin-sidebar">
                <div class="sidebar-nav">
                    <div class="sidebar-header">MAIN MENU</div>
                    <a href="admin_dashboard.html" class="sidebar-item">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="manage_users.html" class="sidebar-item active">
                        <i class="fas fa-users"></i>
                        <span>Users</span>
                    </a>
                    <a href="admin_vehicles.html" class="sidebar-item">
                        <i class="fas fa-car"></i>
                        <span>Vehicles</span>
                    </a>
                    <a href="admin_bookings.html" class="sidebar-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span>Bookings</span>
                    </a>
                    <a href="admin_reports.html" class="sidebar-item">
                        <i class="fas fa-chart-line"></i>
                        <span>Reports</span>
                    </a>
                    <div class="sidebar-header">SYSTEM</div>
                    <a href="../auth/logout.html" class="sidebar-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </aside>

        <main class="main-content">
            <div class="section-header">
                <div class="section-title">Edit User</div>
                <div class="action-buttons">
                    <a href="admin_user_view.html?id=" class="btn btn-outline">
                        <i class="fas fa-arrow-left"></i> Back to View
                    </a>
                </div>
            </div>

            <form method="POST" class="user-edit-form">
                <div class="form-section">
                    <h3 class="section-title">Account Status</h3>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="is_active" >
                            <span class="checkbox-custom"></span>
                            <span>Active Account</span>
                        </label>
                        <p class="form-help">Uncheck to deactivate this user's account</p>
                    </div>
                </div>

                
                <div class="form-section">
                    <h3 class="section-title">Verification Status</h3>
                    <div class="form-group">
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="verification_status" value="approved" 
                                    >
                                <span class="radio-custom"></span>
                                <span>Approved</span>
                            </label>                            <label class="radio-label">
                                <input type="radio" name="verification_status" value="pending" 
                                    >
                                <span class="radio-custom"></span>
                                <span>Pending</span>
                            </label>
                        </div>
                    </div>
                </div>
                

                
<div class="form-section">
    <h3 class="section-title">Verification Status</h3>
    <div class="form-group">
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="verification_status" value="verified" 
                    >
                <span class="radio-custom"></span>
                <span>Verified</span>
            </label>
            <label class="radio-label">
                <input type="radio" name="verification_status" value="pending" 
                    >
                <span class="radio-custom"></span>
                <span>Pending</span>
            </label>
            <label class="radio-label">                <input type="radio" name="verification_status" value="unverified" 
                    >
                <span class="radio-custom"></span>
                <span>Unverified</span>
            </label>
        </div>
    </div>
</div>


                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="admin_user_view.html?id=" class="btn btn-outline">
                        Cancel
                    </a>
                </div>
            </form>
        </main>    </div>    <script src="../public/assets/js/script.js"></script>
