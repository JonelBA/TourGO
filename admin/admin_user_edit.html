<form class="user-edit-form" method="POST">
<div class="form-section">
<h3 class="section-title">Account Status</h3>
<div class="form-group">
<label class="checkbox-label">
<input name="is_active" type="checkbox"/>
<span class="checkbox-custom"></span>
<span>Active Account</span>
</label>
<p class="form-help">Uncheck to deactivate this user's account</p>
</div>
</div>
<div class="form-section">
<h3 class="section-title">Verification Status</h3>
<div class="form-group">
<div class="radio-group">
<label class="radio-label">
<input name="verification_status" type="radio" value="approved"/>
<span class="radio-custom"></span>
<span>Approved</span>
</label> <label class="radio-label">
<input name="verification_status" type="radio" value="pending"/>

</label>
</div>
</div>
</div>

<div class="radio-group">
<label class="radio-label">

<span>Verified</span>
</label>
<label class="radio-label">
<input name="verification_status" type="radio" value="pending"/>

<label class="radio-label"> <input name="verification_status" type="radio" value="unverified"/>

</div>
</div>

                    </a>
